<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Império do Agro: Fazenda Brasil</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#f3e6c8;font-family:'VT323',monospace;font-size:19px;line-height:1.15;-webkit-tap-highlight-color:transparent;overflow:hidden;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}

h1,h2,h3,.px{font-family:'Press Start 2P',monospace;font-weight:normal}






#tabs{display:flex;overflow-x:auto;background:#1c120b;gap:2px;padding:3px 3px 0}
#tabs button{flex:1 0 auto;font-family:'Press Start 2P';font-size:9px;background:#5a3b24;color:#e8d5aa;border:2px solid #1c120b;border-bottom:0;padding:9px 8px;cursor:pointer;white-space:normal;max-width:78%;text-align:center}
#tabs button.on{background:#e0a431;color:#2a1d14}

.card{background:#4f3320;border:2px solid #1c120b;box-shadow:inset 0 0 0 2px #6b4a2d;padding:7px 8px;margin-bottom:7px}
.card.sel{box-shadow:inset 0 0 0 3px #ffd75e}
.card.lock{opacity:.55}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btns{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
button.b{font-family:'VT323';font-size:19px;background:#3f8f3a;color:#fff;border:2px solid #14320f;padding:3px 9px;cursor:pointer;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3),inset 2px 2px 0 rgba(255,255,255,.25)}
button.b:active{transform:translateY(1px)}
button.b.red{background:#b23a2c;border-color:#3d100a}
button.b.gold{background:#d9a02a;border-color:#4a3205;color:#2a1d14}
button.b.gray{background:#6d6d6d;border-color:#222}
button.b.blue{background:#2f6cb3;border-color:#10284a}
button.b:disabled{opacity:.4;cursor:not-allowed}
.tag{display:inline-block;font-size:15px;padding:0 5px;margin:0 3px 2px 0;background:#2a1d14;border:1px solid #8a6a42;color:#e8d5aa}
.tag.g{background:#1f5a2a}.tag.r{background:#7a2018}.tag.y{background:#8a6a10;color:#fff3c0}.tag.p{background:#7a2d63}
.bar{height:7px;background:#1c120b;border:1px solid #000;margin-top:2px}.bar i{display:block;height:100%}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.pills button{font-family:'VT323';font-size:18px;background:#5a3b24;color:#e8d5aa;border:2px solid #1c120b;padding:2px 9px;cursor:pointer}
.pills button.on{background:#e0a431;color:#2a1d14}
.dim{color:#b9a27a}.gold{color:#ffd75e}.grn{color:#7fe07a}.red{color:#ff7f6e}
h3{font-size:11px;margin:4px 0 8px;color:#ffd75e;line-height:1.5}
#toast{position:fixed;left:0;right:0;top:200px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:50}
#toast div{background:#1c120b;border:2px solid #e0a431;padding:5px 10px;max-width:88%;animation:tin .25s;font-size:16px;line-height:1.05}
#toast div.bad{border-color:#d9503f}#toast div.good{border-color:#5fd95a}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:40;padding:10px}
#modal .box{background:#3a2616;border:4px solid #e0a431;max-width:560px;width:100%;padding:12px;margin:auto}
#modal canvas{width:100%;max-width:340px;image-rendering:pixelated;background:#79c26a;border:3px solid #1c120b;display:block;margin:6px auto}
.big{font-family:'Press Start 2P';font-size:15px;color:#ffd75e}
table{width:100%;border-collapse:collapse}td,th{padding:2px 4px;text-align:left;border-bottom:1px solid #5a3b24;font-weight:normal}
.right{text-align:right}

html{height:100%}
#cv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges;background:#222}
.hb{background:rgba(28,18,11,.84);border:2px solid #0e0905;padding:3px 7px;font-size:18px;color:#f3e6c8;pointer-events:none}
#hudL{position:fixed;left:6px;top:6px;z-index:5}
#hudL .m{font-family:'Press Start 2P';font-size:12px;color:#ffd75e}
#hudR{position:fixed;right:6px;top:6px;z-index:6;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
#hudR button{font-family:'Press Start 2P';font-size:10px;background:#5a3b24;color:#f3e6c8;border:2px solid #0e0905;padding:8px 8px;cursor:pointer;touch-action:manipulation}
#hudR button.on{background:#e0a431;color:#2a1d14}
#hudH{position:fixed;left:6px;top:98px;z-index:5;max-width:46%;font-size:17px;line-height:1.05}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:132px;z-index:7;background:rgba(224,164,49,.95);color:#2a1d14;border:2px solid #0e0905;padding:4px 10px;font-size:20px;display:none;pointer-events:none;white-space:nowrap}
#prog{position:fixed;left:50%;top:40%;transform:translateX(-50%);width:140px;z-index:7;display:none}
.joy,.cb{display:none}
.touch .joy{display:block}.touch .cb{display:flex}
#joy{position:fixed;left:14px;bottom:18px;width:116px;height:116px;border-radius:50%;background:rgba(255,255,255,.13);border:3px solid rgba(255,255,255,.35);z-index:8;touch-action:none}
#knob{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.5)}
.cb{position:fixed;width:56px;height:56px;border-radius:50%;background:rgba(40,28,18,.8);border:3px solid rgba(255,255,255,.45);color:#fff;font-size:24px;align-items:center;justify-content:center;z-index:8;touch-action:none}
.cb.on{background:rgba(224,164,49,.9)}
.cb small{position:absolute;bottom:-1px;font-size:11px;font-family:'VT323'}
.keys{position:fixed;left:6px;bottom:6px;z-index:4;font-size:15px;color:#d8c8a0;background:rgba(0,0,0,.5);padding:2px 6px;pointer-events:none}
.touch .keys{display:none}
#menu{position:fixed;inset:0;background:rgba(10,6,3,.88);display:none;z-index:30;overflow:auto;padding:8px}
.mwrap{max-width:760px;margin:0 auto}
.mhead{display:flex;justify-content:space-between;align-items:center;background:#4a2f1d;border:3px solid #1c120b;padding:6px 8px}
#panel{background:#3a2616;border:3px solid #1c120b;border-top:0;padding:8px;min-height:260px}
.sec{font-family:'Press Start 2P';font-size:10px;color:#ffd75e;margin:10px 0 6px}
.sw{display:inline-block;width:14px;height:14px;border:2px solid #000;vertical-align:middle;margin-right:4px}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hudL" class="hb"></div>
<div id="hudR"></div>
<div id="hudH" class="hb" style="display:none"></div>
<div id="hint"></div>
<div id="tut" class="hb" style="position:fixed;right:6px;top:92px;max-width:50%;font-size:16px;line-height:1.05;display:none;z-index:5"></div>
<div id="prog" class="hb"><div id="progt" style="font-size:16px"></div><div class="bar"><i id="progb" style="width:0;background:#5fd95a"></i></div></div>
<div class="keys">WASD mover · Shift correr · C agachar · E interagir · botão direito/Q mirar · clique/Espaço atirar · R recarregar · B binóculo · U usar item · Esc menu</div>
<div id="joy" class="joy"><div id="knob"></div></div>
<div class="cb" id="bE" style="right:16px;bottom:70px;width:68px;height:68px;font-size:26px">✋<small>AGIR</small></div>
<div class="cb" id="bAim" style="right:96px;bottom:22px">🎯<small>MIRAR</small></div>
<div class="cb" id="bFire" style="right:96px;bottom:92px;width:64px;height:64px;background:rgba(190,50,40,.9);display:none">💥<small>FOGO</small></div>
<div class="cb" id="bHold" style="right:170px;bottom:70px;display:none">😮‍💨<small>FÔLEGO</small></div>
<div class="cb" id="bSneak" style="right:16px;bottom:150px">🐾<small>AGACHAR</small></div>
<div class="cb" id="bRel" style="right:170px;bottom:140px;display:none">🔄<small>RECARR.</small></div>
<div class="cb" id="bDogA" style="left:14px;bottom:150px;width:48px;height:48px;font-size:20px">⚔️<small>ATACAR</small></div>
<div class="cb" id="bDogT" style="left:14px;bottom:206px;width:48px;height:48px;font-size:20px">👃<small>RASTRO</small></div>
<div class="cb" id="bDogS" style="left:70px;bottom:150px;width:48px;height:48px;font-size:20px">🐕<small>FICAR</small></div>
<div class="cb" id="bBin" style="right:90px;bottom:166px;width:50px;height:50px">🔭</div>
<div class="cb" id="bUse" style="right:16px;bottom:224px;width:50px;height:50px">🧪</div>
<div id="menu"><div class="mwrap"><div class="mhead"><b class="px" style="font-size:11px">☰ MENU</b><button class="b red" data-act="menuclose">Fechar ✕</button></div><nav id="tabs"></nav><main id="panel"></main></div></div>
<div id="toast"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<script>
